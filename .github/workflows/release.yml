# Pushing a tag like v2.0.0 creates a draft GitHub release with the app.
# Signing and notarization run only when the Apple secrets are set; see the README.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: cargo test --locked

      - name: Import the signing certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Build the app
        env:
          HIFIGUARD_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: ./build.sh --universal

      - name: Notarize
        if: env.APPLE_CERTIFICATE_P12 != '' && env.APPLE_ID != ''
        run: |
          ditto -c -k --keepParent "target/HiFi Guard.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "target/HiFi Guard.app"
          echo "NOTARIZED=true" >> "$GITHUB_ENV"

      - name: Package
        run: |
          zip="HiFi-Guard-$VERSION.zip"
          ditto -c -k --keepParent "target/HiFi Guard.app" "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          files=("$zip" "$zip.sha256")
          # Homebrew installs that Gatekeeper rejects are of no use, so only notarized builds get a cask.
          if [[ "${NOTARIZED:-}" == "true" ]]; then
            sha=$(cut -d' ' -f1 "$zip.sha256")
            sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$sha/" packaging/hifi-guard.rb > hifi-guard.rb
            files+=(hifi-guard.rb)
          fi
          printf '%s\n' "${files[@]}" > release-files.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r f; do args+=("$f"); done < release-files.txt
          gh release create "$GITHUB_REF_NAME" "${args[@]}" --draft --generate-notes --title "HiFi Guard $VERSION"
