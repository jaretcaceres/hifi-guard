<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Colours follow macOS: the user's accent colour and the system label colours (WebKit system colours). */
  :root {
    --acc: #0a84ff;
    --text: #f5f5f7; --dim: rgba(235,235,245,.6); --faint: rgba(235,235,245,.3);
    --card: rgba(255,255,255,.07); --card2: rgba(255,255,255,.12); --line: rgba(255,255,255,.09);
    --warn: #ff9f0a; --ok: #30d158;
    --ease: cubic-bezier(.32,.72,0,1);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --text: #1d1d1f; --dim: rgba(60,60,67,.6); --faint: rgba(60,60,67,.3);
      --card: rgba(255,255,255,.5); --card2: rgba(255,255,255,.72); --line: rgba(0,0,0,.06);
      --warn: #f08c00;
    }
  }
  /* Only the accent comes from WebKit's system colours: its label colours resolve against the light
     appearance inside this window, so text uses the scheme-aware tokens above. */
  @supports (color: -apple-system-control-accent) {
    :root { --acc: -apple-system-control-accent; }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body { font: 13px/1.3 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: default; outline: none; }
  svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .shell { height: 100vh; display: flex; flex-direction: column; padding: 14px 14px 10px; gap: 12px; }

  /* Header */
  header { display: flex; align-items: center; gap: 10px; padding: 0 2px; }
  .logo { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none;
    background: linear-gradient(160deg, #5b97ff, #1d3fae 62%, #0c1648); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.25), 0 1px 3px rgba(0,0,0,.25); }
  .logo svg { width: 18px; height: 18px; stroke-width: 2.1; }
  .title { flex: 1; min-width: 0; }
  .title b { font-size: 13px; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 11.5px; margin-top: 1px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); transition: background .3s; }
  .dot.warn { background: var(--warn); } .dot.off { background: var(--faint); }

  /* Switch (macOS style, accent colour) */
  .switch { width: 32px; height: 19px; border-radius: 10px; background: var(--card2); position: relative; flex: none;
    box-shadow: inset 0 0 0 .5px var(--line); transition: background .22s var(--ease); }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 0 0 .5px rgba(0,0,0,.06); transition: transform .26s var(--ease); }
  .switch.on { background: var(--acc); } .switch.on::after { transform: translateX(13px); }

  /* Segmented control */
  .seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-radius: 9px; padding: 2px; }
  .seg .pill { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / 3); border-radius: 7px;
    background: var(--card2); box-shadow: 0 1px 2px rgba(0,0,0,.18), inset 0 0 0 .5px var(--line); transition: transform .3s var(--ease); }
  .seg button { position: relative; height: 24px; font-size: 12px; font-weight: 500; color: var(--dim); transition: color .2s; }
  .seg button.on { color: var(--text); }

  /* Scrolling content: no visible scrollbar, soft fade at the bottom edge */
  main { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px 10px;
    -webkit-mask-image: linear-gradient(#000 calc(100% - 14px), transparent); }
  main::-webkit-scrollbar { display: none; }
  .pane { display: none; flex-direction: column; gap: 10px; }
  .pane.on { display: flex; }
  .pane.enter { animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: 0; } }

  .card { background: var(--card); border-radius: 12px; box-shadow: inset 0 0 0 .5px var(--line); }
  #outBox, #inBox { overflow: hidden; }
  .label { color: var(--dim); font-size: 11px; font-weight: 600; padding: 0 4px; margin-bottom: -4px; }

  /* Hero */
  .hero { position: relative; overflow: hidden; display: grid; grid-template-columns: 88px 1fr 88px; align-items: center; padding: 14px 8px 12px; border-radius: 16px; }
  .hero::before { content: ""; position: absolute; inset: 0; opacity: .5; transition: opacity .4s;
    background: radial-gradient(120% 90% at 85% 40%, color-mix(in srgb, var(--hc, var(--acc)) 22%, transparent), transparent 70%); }
  .hero > * { position: relative; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .side span { font-size: 11px; color: var(--dim); max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mac { width: 88px; height: 58px; object-fit: cover; object-position: center 56%; filter: drop-shadow(0 3px 5px rgba(0,0,0,.3)); }
  .lanes { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 500; white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; color: var(--dim); background: var(--card); box-shadow: inset 0 0 0 .5px var(--line); }
  .tag.warn { color: var(--warn); }
  .tag svg { width: 10px; height: 10px; }
  .lane { --c: var(--acc); --dur: 1.6s; position: relative; width: 100%; height: 12px; }
  .lane::before { content: ""; position: absolute; left: 0; right: 0; top: 5.25px; height: 1.5px; border-radius: 1px; background: color-mix(in srgb, var(--c) 28%, transparent); transition: background .4s; }
  .lane.idle::before { background: repeating-linear-gradient(90deg, var(--faint) 0 3px, transparent 3px 7px); }
  .lane i { position: absolute; top: 3px; left: 0; width: 6px; height: 6px; border-radius: 50%; background: var(--c); opacity: 0;
    box-shadow: 0 0 6px 1px color-mix(in srgb, var(--c) 60%, transparent); animation: flow var(--dur) cubic-bezier(.45,.05,.55,.95) infinite; }
  .lane i:nth-child(2) { animation-delay: calc(var(--dur) / -3); } .lane i:nth-child(3) { animation-delay: calc(var(--dur) / -1.5); }
  .lane.rev i { animation-name: flowrev; }
  .lane.idle i { display: none; }
  @keyframes flow { 0% { transform: translateX(0); opacity: 0; } 20%, 80% { opacity: 1; } 100% { transform: translateX(calc(var(--w) - 6px)); opacity: 0; } }
  @keyframes flowrev { 0% { transform: translateX(calc(var(--w) - 6px)); opacity: 0; } 20%, 80% { opacity: 1; } 100% { transform: translateX(0); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .lane i { display: none; } .pane.enter { animation: none; } }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { padding: 8px 10px; }
  .stat small { display: flex; align-items: center; gap: 4px; color: var(--dim); font-size: 10.5px; }
  .stat small svg { width: 11px; height: 11px; }
  .stat b { display: block; margin-top: 3px; font: 600 17px/1.15 ui-rounded, -apple-system, system-ui, sans-serif; transition: color .3s; }
  .stat em { font-style: normal; font-size: 11px; font-weight: 500; color: var(--dim); margin-left: 2px; }
  .stats.warn b { color: var(--warn); }

  /* Alert */
  .alert { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--c) 13%, transparent); box-shadow: inset 0 0 0 .5px color-mix(in srgb, var(--c) 35%, transparent); animation: fade .2s ease-out; }
  .alert .ic { color: var(--c); padding-top: 1px; } .alert .ic svg { width: 16px; height: 16px; }
  .alert b { font-size: 12.5px; font-weight: 600; } .alert p { color: var(--dim); font-size: 11.5px; margin-top: 2px; }
  .btn { margin-top: 7px; padding: 3px 11px; border-radius: 6px; background: var(--card2); box-shadow: inset 0 0 0 .5px var(--line), 0 .5px 1px rgba(0,0,0,.15); font-size: 12px; font-weight: 500; }
  .btn:active { filter: brightness(.9); }

  /* Mode */
  .mode { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; border-radius: 12px; }
  .mode .pill { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 5px); border-radius: 9px; background: var(--card2);
    box-shadow: 0 1px 2px rgba(0,0,0,.15), inset 0 0 0 .5px var(--line); transition: transform .32s var(--ease); }
  .mode.call .pill { transform: translateX(calc(100% + 4px)); }
  .mode button { position: relative; display: flex; align-items: center; gap: 9px; padding: 6px 7px; text-align: left; }
  .mode .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--dim); background: var(--card); transition: background .25s, color .25s; }
  .mode .ic svg { width: 13px; height: 13px; }
  .mode button.on .ic { background: var(--acc); color: #fff; }
  .mode.call button.on .ic { background: var(--warn); }
  .mode b { display: block; font-size: 12.5px; font-weight: 600; } .mode small { color: var(--dim); font-size: 10.5px; }

  /* Device rows with a real disclosure animation */
  .row { display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 10px; text-align: left; border-radius: 12px; transition: background .15s, border-radius .3s var(--ease); }
  .open .row { border-radius: 12px 12px 8px 8px; }
  .row:hover { background: var(--card2); }
  .row .meta { flex: 1; min-width: 0; }
  .row small { display: block; font-size: 10.5px; color: var(--dim); }
  .nm { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm { font-size: 13px; }
  .chev { color: var(--faint); transition: transform .3s var(--ease); } .open .chev { transform: rotate(180deg); }
  .badge { padding: 1px 6px; border-radius: 5px; font-size: 10px; font-weight: 600; color: var(--dim); background: var(--card); box-shadow: inset 0 0 0 .5px var(--line); }
  .badge.warn { color: var(--warn); }
  .drop { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .3s var(--ease), opacity .2s; }
  .drop.open { grid-template-rows: 1fr; opacity: 1; }
  .drop > div { overflow: hidden; min-height: 0; }
  .list { padding: 4px; margin-top: 4px; }
  .opt { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 8px; border-radius: 7px; text-align: left; transition: background .12s; }
  .opt:hover { background: var(--card2); }
  .opt .meta { flex: 1; min-width: 0; }
  .sub { font-size: 10.5px; color: var(--dim); } .sub.warn { color: var(--warn); }
  .check { color: var(--text); }
  .thumb { width: 28px; height: 28px; flex: none; display: grid; place-items: center; }
  .thumb img { width: 32px; height: 21px; object-fit: cover; object-position: center 56%; }
  .thumb.sm { width: 22px; height: 22px; } .thumb.sm img { width: 26px; height: 17px; }
  .orb { width: 80%; height: 80%; border-radius: 50%; display: grid; place-items: center; color: var(--dim); background: var(--card2); box-shadow: inset 0 0 0 .5px var(--line); }
  .orb svg { width: 55%; height: 55%; }

  /* Priority */
  .hint { color: var(--dim); font-size: 11.5px; padding: 0 2px; }
  .plist { padding: 3px; }
  .prow { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 7px; border-radius: 7px; transition: background .12s; }
  .prow:hover { background: var(--card2); }
  .rank { width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font: 600 10px ui-rounded, -apple-system, system-ui, sans-serif; color: var(--dim); background: var(--card2); flex: none; }
  .prow:first-child .rank { background: var(--acc); color: #fff; }
  .prow .meta { flex: 1; min-width: 0; } .prow .nm { font-size: 12px; } .prow .sub { font-size: 10px; }
  .inuse { font-size: 10px; font-weight: 600; color: #fff; background: var(--acc); padding: 2px 7px; border-radius: 99px; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .arrows { display: flex; gap: 1px; opacity: 0; transition: opacity .15s; } .prow:hover .arrows { opacity: 1; }
  .arrows button { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; color: var(--dim); }
  .arrows button:hover { background: var(--card2); color: var(--text); }
  .arrows button:disabled { opacity: .25; } .arrows svg { width: 11px; height: 11px; stroke-width: 2.4; }
  .bar { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 0 2px; }
  .bar label { display: flex; align-items: center; gap: 8px; }
  .bar .btn { margin: 0; }

  /* Settings: monochrome icons, like Control Center */
  .set { display: flex; align-items: center; gap: 11px; padding: 8px 12px; }
  .set + .set { box-shadow: 0 -.5px 0 var(--line); }
  .set > svg.i { width: 16px; height: 16px; color: var(--dim); }
  .set .meta { flex: 1; min-width: 0; } .set b { font-size: 12.5px; font-weight: 400; } .set p { font-size: 10.5px; color: var(--dim); }
  .keys { display: flex; gap: 3px; }
  kbd { min-width: 20px; height: 20px; padding: 0 4px; display: grid; place-items: center; border-radius: 5px; background: var(--card2); box-shadow: inset 0 0 0 .5px var(--line), 0 .5px 0 rgba(0,0,0,.2); font: 500 11px -apple-system, system-ui, sans-serif; color: var(--dim); }
  .meta2 { display: flex; justify-content: space-between; color: var(--faint); font-size: 10.5px; padding: 0 4px; }

  /* Footer */
  footer { display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: 11px; padding: 0 2px; }
  footer .msg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  footer .msg svg { width: 12px; height: 12px; }
  .quit { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; transition: background .12s; }
  .quit:hover { background: var(--card2); color: var(--text); }
  .quit svg { width: 13px; height: 13px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c5f66"/><stop offset="1" stop-color="#17191d"/></linearGradient>
  </defs>
  <symbol id="headset" viewBox="0 0 100 100">
    <circle cx="50" cy="58" r="30" style="fill: var(--glowc); opacity: .28; filter: blur(10px)"/>
    <path d="M14 60 A36 36 0 0 1 86 60" fill="none" stroke="url(#shell)" stroke-width="8" stroke-linecap="round"/>
    <path d="M22 44 A30 30 0 0 1 78 44" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M17 80 Q18 97 42 95" fill="none" stroke="#2c2d31" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="44" cy="95" r="3.8" style="fill: var(--micc); filter: drop-shadow(0 0 3px var(--micc))"/>
    <rect x="17" y="46" width="12" height="34" rx="6" fill="#141416"/>
    <rect x="7" y="45" width="20" height="38" rx="10" fill="url(#shell)" stroke="rgba(255,255,255,.16)"/>
    <rect x="11.5" y="54" width="3.6" height="20" rx="1.8" style="fill: var(--glowc); filter: drop-shadow(0 0 3px var(--glowc))"/>
    <rect x="71" y="46" width="12" height="34" rx="6" fill="#141416"/>
    <rect x="73" y="45" width="20" height="38" rx="10" fill="url(#shell)" stroke="rgba(255,255,255,.16)"/>
    <rect x="84.9" y="54" width="3.6" height="20" rx="1.8" style="fill: var(--glowc); filter: drop-shadow(0 0 3px var(--glowc))"/>
  </symbol>
</svg>

<div class="shell">
  <header>
    <div class="logo" id="logo"></div>
    <div class="title"><b>HiFi Guard</b><div class="status"><span class="dot" id="dot"></span><span id="statusText"></span></div></div>
    <button class="switch" id="master" aria-label="Activar HiFi Guard"></button>
  </header>

  <div class="seg" id="tabs">
    <div class="pill"></div>
    <button data-tab="0" class="on">Estado</button><button data-tab="1">Prioridad</button><button data-tab="2">Ajustes</button>
  </div>

  <main id="main">
    <section class="pane on" id="p0">
      <div class="hero card" id="hero">
        <div class="side"><img class="mac" id="macImg" alt=""><span>Este Mac</span></div>
        <div class="lanes">
          <span class="tag" id="outTag"></span>
          <div class="lane" id="outLane"><i></i><i></i><i></i></div>
          <div class="lane rev" id="micLane"><i></i><i></i><i></i></div>
          <span class="tag" id="micTag"></span>
        </div>
        <div class="side"><div id="heroArt"></div><span id="heroName"></span></div>
      </div>
      <div class="stats" id="stats">
        <div class="stat card"><small id="sRateL"></small><b><span id="sRate"></span><em>kHz</em></b></div>
        <div class="stat card"><small id="sChL"></small><b id="sCh"></b></div>
        <div class="stat card"><small id="sLinkL"></small><b id="sLink"></b></div>
      </div>
      <div id="alert"></div>
      <div class="mode card" id="mode">
        <div class="pill"></div>
        <button data-call="0"><span class="ic" id="mHifi"></span><span><b>Hi-Fi</b><small>Máxima calidad</small></span></button>
        <button data-call="1"><span class="ic" id="mCall"></span><span><b>Llamada</b><small>Micro de los cascos</small></span></button>
      </div>
      <div class="card" id="outBox"><button class="row" id="outRow" data-list="out"></button><div class="drop"><div><div class="list" id="outList"></div></div></div></div>
      <div class="card" id="inBox"><button class="row" id="inRow" data-list="in"></button><div class="drop"><div><div class="list" id="inList"></div></div></div></div>
    </section>

    <section class="pane" id="p1">
      <p class="hint">Al conectar o desconectar algo, HiFi Guard elige el primero disponible de cada lista. El micro Bluetooth nunca se elige solo.</p>
      <div class="label">Sonido</div><div class="plist card" id="pOut"></div>
      <div class="label">Micro</div><div class="plist card" id="pIn"></div>
      <div class="bar"><label><button class="switch" data-opt="auto_priority"></button>Cambio automático</label><button class="btn" id="reset">Restablecer</button></div>
    </section>

    <section class="pane" id="p2">
      <div class="card" id="g1"></div>
      <div class="card" id="g2"></div>
      <div class="card"><div class="set"><span class="meta"><b>Activar o desactivar</b></span><span class="keys"><kbd>⌃</kbd><kbd>⌥</kbd><kbd>⌘</kbd><kbd>H</kbd></span></div></div>
      <div class="meta2"><span id="fixes"></span><span>v2.1</span></div>
    </section>
  </main>

  <footer><span class="msg" id="footMsg"></span><button class="quit" id="quit" title="Salir de HiFi Guard"></button></footer>
</div>

const P = {

  warn: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  pause: '<circle cx="12" cy="12" r="10"/><path d="M10 9v6"/><path d="M14 9v6"/>',
  down: '<path d="m6 9 6 6 6-6"/>', up: '<path d="m18 15-6-6-6 6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  power: '<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  done: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  list: '<path d="M10 6h11"/><path d="M10 12h11"/><path d="M10 18h11"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  laptop: '<path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.3 2.6a1 1 0 0 1-.9 1.4H3.6a1 1 0 0 1-.9-1.4L4 16"/>',
  display: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>',
  iphone: '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
  radio: '<path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2a6 6 0 0 1 0-8.5"/><path d="M16.2 7.8a6 6 0 0 1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/><circle cx="12" cy="12" r="2"/>',
};
const ic = (n) => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const post = (o) => window.ipc.postMessage(JSON.stringify(o));
// Only touch the DOM when content actually changed, so hover states and transitions survive updates.
const put = (el, html) => { if (el._h !== html) { el._h = html; el.innerHTML = html; } };
const text = (el, t) => { if (el.textContent !== t) el.textContent = t; };

let S = window.__STATE__, open = null, tab = 0;

function headset(size, glow, mic) {
  return `<svg viewBox="0 0 100 100" style="width:${size}px;height:${size}px;--glowc:${glow};--micc:${mic}"><use href="#headset"/></svg>`;
}
function thumb(d, small) {
  const cls = small ? 'thumb sm' : 'thumb';
  if (!d) return `<span class="${cls}"></span>`;
  if (d.kind === 'mac' && window.__MAC__) return `<span class="${cls}"><img src="${window.__MAC__}" alt=""></span>`;
  if (d.kind === 'headset') return `<span class="${cls}">${headset(small ? 22 : 28, d.callMode ? 'var(--warn)' : 'var(--acc)', 'var(--acc)')}</span>`;
  const n = { speaker: 'speaker', display: 'display', phone: 'iphone', virtual: 'wave' }[d.kind] || 'speaker';
  return `<span class="${cls}"><span class="orb">${ic(n)}</span></span>`;
}
const rateNum = (r) => { if (!r) return '—'; const k = r / 1000; return Number.isInteger(k) ? String(k) : k.toFixed(1).replace('.', ','); };
const ago = (s) => s < 5 ? 'ahora' : s < 60 ? `hace ${s} s` : s < 3600 ? `hace ${Math.floor(s / 60)} min` : `hace ${Math.floor(s / 3600)} h`;

window.render = function (state) {
  S = state;
  const out = S.output, inp = S.input;

  // Header
  $('dot').className = 'dot' + (!S.enabled ? ' off' : S.callMode ? ' warn' : '');
  text($('statusText'), !S.enabled ? 'En pausa' : S.callMode ? 'Modo llamada detectado' : 'Hi-Fi protegido');
  $('master').classList.toggle('on', S.enabled);

  // Hero: one accent colour; orange only when something is wrong.
  const outC = !S.enabled ? 'var(--faint)' : out?.callMode ? 'var(--warn)' : 'var(--acc)';
  const micC = inp?.bt ? 'var(--warn)' : S.enabled ? 'var(--acc)' : 'var(--faint)';
  $('hero').style.setProperty('--hc', out?.callMode ? 'var(--warn)' : 'var(--acc)');
  const dur = !out ? 0 : out.callMode ? 3.4 : out.bt ? 2.2 : 1.6;
  for (const [lane, c, idle] of [[$('outLane'), outC, !out], [$('micLane'), micC, !S.micIsHeadset]]) {
    lane.style.setProperty('--c', c);
    lane.style.setProperty('--dur', dur + 's');
    lane.classList.toggle('idle', idle);
  }
  put($('outTag'), ic('speaker') + esc(out ? `${S.outputLink} · ${out.rateLabel.replace('.', ',')}` : '—'));
  $('outTag').classList.toggle('warn', !!out?.callMode);
  const micText = !inp ? 'Sin micro' : inp.builtin ? 'Micro del Mac' : inp.bt ? 'Micro BT · llamada' : inp.name;
  put($('micTag'), ic(S.micIsHeadset ? 'mic' : 'laptop') + esc(micText));
  $('micTag').classList.toggle('warn', !!inp?.bt);
  put($('heroArt'), !out ? '' : out.kind === 'headset' ? headset(82, outC, S.micIsHeadset ? micC : '#3a3a3c')
    : out.kind === 'mac' ? `<img class="mac" src="${window.__MAC__}" alt="">`
    : `<span class="thumb" style="width:64px;height:64px">${thumb(out).replace(/^<span class="thumb">|<\/span>$/g, '')}</span>`);
  text($('heroName'), out?.name || 'Sin salida');

  // Stats
  $('stats').classList.toggle('warn', !!out?.callMode);
  text($('sRate'), rateNum(out?.rate));
  text($('sCh'), out?.stereo ? 'Estéreo' : 'Mono');
  text($('sLink'), S.outputLink);
  put($('sLinkL'), ic(out?.bt ? 'bt' : 'plug') + 'Enlace');

  // Alert
  let a = '';
  if (S.appHoldsBtMic && S.btMicApps.length) {
    const app = S.btMicApps[0];
    a = alertCard('warn', `${app} fuerza el micro Bluetooth`,
      `Por eso los cascos están en modo llamada. En ${app} → Voz y vídeo, pon Dispositivo de entrada en "Predeterminado".`,
      `Abrir ${app}`, { cmd: 'openApp', name: app });
  } else if (!S.enabled) {
    a = alertCard('pause', 'Protección en pausa', 'macOS puede volver a poner los cascos en modo llamada.', 'Activar', { cmd: 'mode', call: false }, 'var(--dim)');
  } else if (S.callMode) {
    a = alertCard('phone', 'Bluetooth en modo llamada', 'Algo está usando el micro de los cascos. Se arreglará en cuanto lo suelte.');
  }
  put($('alert'), a);

  // Mode
  $('mode').classList.toggle('call', !S.enabled);
  $('mode').querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === (S.enabled ? 0 : 1)));

  deviceRow('out', 'Sonido', out, S.outputs);
  deviceRow('in', 'Micro', inp, S.inputs);

  // Priority
  put($('pOut'), S.outputs.map((d, i) => prow(d, i, S.outputs.length, false, out)).join(''));
  put($('pIn'), S.inputs.map((d, i) => prow(d, i, S.inputs.length, true, inp)).join(''));

  // Settings: switches are long-lived elements, so they slide instead of jumping.
  document.querySelectorAll('[data-opt]').forEach((el) => el.classList.toggle('on', !!S.opts[el.dataset.opt]));
  text($('fixes'), `${S.fixCount} correcciones en esta sesión`);

  put($('footMsg'), S.lastAction ? `${ic('done')}${esc(S.lastAction.text)} · ${ago(S.lastAction.ago)}` : `${ic('shield')}Sin incidencias`);
};

function alertCard(icon, title, body, btn, action, color = 'var(--warn)') {
  return `<div class="alert" style="--c:${color}"><span class="ic">${ic(icon)}</span><div><b>${esc(title)}</b><p>${esc(body)}</p>` +
    (btn ? `<button class="btn" data-action="${esc(JSON.stringify(action))}">${esc(btn)}</button>` : '') + `</div></div>`;
}

function deviceRow(key, label, cur, list) {
  const badge = cur ? `<span class="badge${cur.callMode ? ' warn' : ''}">${esc(cur.link)}</span>` : '';
  put($(key + 'Row'), `${thumb(cur)}<span class="meta"><small>${label}</small><div class="nm">${esc(cur?.name || '—')}</div></span>${badge}<span class="chev">${ic('down')}</span>`);
  $(key + 'Box').classList.toggle('open', open === key);
  $(key + 'Box').querySelector('.drop').classList.toggle('open', open === key);
  put($(key + 'List'), list.map((d) => {
    const extra = d.btMicOnly ? ['activa el modo llamada'] : d.callMode ? ['modo llamada'] : [];
    const sub = [d.transport, d.rateLabel.replace('.', ',')].concat(extra).join(' · ');
    return `<button class="opt" data-pick="${key}" data-uid="${esc(d.uid)}">${thumb(d, true)}<span class="meta"><div class="nm">${esc(d.name)}</div>` +
      `<div class="sub${extra.length ? ' warn' : ''}">${esc(sub)}</div></span>${cur && d.uid === cur.uid ? `<span class="check">${ic('check')}</span>` : ''}</button>`;
  }).join(''));
}

function prow(d, i, n, input, cur) {
  const sub = d.blocked ? '<div class="sub warn">Bloqueado · modo llamada</div>' : `<div class="sub">${esc(d.transport)} · ${esc(d.rateLabel.replace('.', ','))}</div>`;
  return `<div class="prow"><span class="rank">${i + 1}</span>${thumb(d, true)}<span class="meta"><div class="nm">${esc(d.name)}</div>${sub}</span>` +
    (cur && d.uid === cur.uid ? '<span class="inuse">En uso</span>' : '') +
    `<span class="arrows"><button data-move="-1" data-input="${input}" data-uid="${esc(d.uid)}" ${i === 0 ? 'disabled' : ''}>${ic('up')}</button>` +
    `<button data-move="1" data-input="${input}" data-uid="${esc(d.uid)}" ${i === n - 1 ? 'disabled' : ''}>${ic('down')}</button></span></div>`;
}

function setRow(icon, title, sub, key) {
  return `<div class="set">${ic(icon)}<span class="meta"><b>${esc(title)}</b>${sub ? `<p>${esc(sub)}</p>` : ''}</span><button class="switch" data-opt="${key}"></button></div>`;
}

// Static content, built once.
$('logo').innerHTML = ic('headphones');
$('quit').innerHTML = ic('power');
$('macImg').src = window.__MAC__ || '';
$('sRateL').innerHTML = ic('wave') + 'Frecuencia';
$('sChL').innerHTML = ic('radio') + 'Canales';
$('mHifi').innerHTML = ic('wave');
$('mCall').innerHTML = ic('phone');
$('g1').innerHTML =
  setRow('plug', 'Preferir USB al Bluetooth', 'Usa la base o el dongle si está conectado', 'prefer_wired') +
  setRow('micoff', 'Bloquear micro Bluetooth', 'Evita el modo llamada de los cascos', 'block_bt_mic') +
  setRow('list', 'Cambio automático', 'Elige por prioridad al conectar algo', 'auto_priority') +
  setRow('wave', 'Máxima frecuencia', 'Pone USB y cable a su mejor calidad', 'max_rate');
$('g2').innerHTML =
  setRow('bell', 'Aviso en pantalla', 'Muestra cada cambio de dispositivo', 'show_hud') +
  setRow('power', 'Abrir al iniciar sesión', '', 'launch_at_login');

function setTab(i) {
  if (i === tab) return;
  tab = i;
  document.querySelectorAll('#tabs button').forEach((b, j) => b.classList.toggle('on', j === tab));
  document.querySelector('#tabs .pill').style.transform = `translateX(${tab * 100}%)`;
  document.querySelectorAll('.pane').forEach((p, j) => {
    p.classList.toggle('on', j === tab);
    p.classList.remove('enter');
    if (j === tab) { void p.offsetWidth; p.classList.add('enter'); }
  });
  $('main').scrollTop = 0;
  lw();
}

function toggleList(key) {
  open = open === key ? null : key;
  for (const k of ['out', 'in']) {
    $(k + 'Box').classList.toggle('open', open === k);
    $(k + 'Box').querySelector('.drop').classList.toggle('open', open === k);
  }
}

// One delegated click handler for everything.
document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t || t.disabled) return;
  if (t.id === 'master') { t.classList.toggle('on'); return post({ cmd: 'toggle' }); }
  if (t.id === 'quit') return post({ cmd: 'quit' });
  if (t.id === 'reset') return post({ cmd: 'resetPriority' });
  if (t.dataset.tab) return setTab(+t.dataset.tab);
  if (t.dataset.call) {
    $('mode').classList.toggle('call', t.dataset.call === '1');
    return post({ cmd: 'mode', call: t.dataset.call === '1' });
  }
  if (t.dataset.list) return toggleList(t.dataset.list);
  if (t.dataset.pick) { toggleList(null); return post({ cmd: t.dataset.pick === 'out' ? 'selectOutput' : 'selectInput', uid: t.dataset.uid }); }
  if (t.dataset.move) return post({ cmd: 'move', uid: t.dataset.uid, input: t.dataset.input === 'true', delta: +t.dataset.move });
  if (t.dataset.opt) {
    t.classList.toggle('on');
    return post({ cmd: 'set', key: t.dataset.opt, value: t.classList.contains('on') });
  }
  if (t.dataset.action) return post(JSON.parse(t.dataset.action));
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') post({ cmd: 'close' }); });

// Lane width drives the particle travel distance.
function lw() { document.querySelectorAll('.lane').forEach((l) => l.style.setProperty('--w', l.clientWidth + 'px')); }
window.render(S);
if (window.__TAB__) setTab(window.__TAB__);
lw();
// Synchronous on purpose: the window is hidden until 'ready', and hidden web views get no animation frames.
post({ cmd: 'ready' });
requestAnimationFrame(lw);
</script>
</body>
</html>
