[package]
name = "hifiguard"
version = "2.0.0"
edition = "2021"

[dependencies]
tao = "0.30"
wry = { version = "0.47", features = ["transparent"] }
tray-icon = { version = "0.19", default-features = false }
global-hotkey = "0.6"
objc2 = "0.5"
block2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
